<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crud Empleados JS</title>
  <link href="./css/bootstrap.min (2).css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <div class="container">
    <div class="row mt-5">
      <div class="col-md-5">
        <div class="card">
          <div class="card-header">Empleados</div>
          <div class="card-body">
            <form action="javascript:void(0);" method="post" onsubmit="aplicacion.Agregar" class="mb-3">
              <label for="" class="form-label">Nombre</label>
              <input type="text" class="form-control" name="nombre" id="nombre" placeholder="Nombre del empleado" />
            </form>

            <div class="mb-3">
              <label for="" class="form-label">Email</label>
              <input type="email" class="form-control" name="email" id="email" placeholder="Email del empleado" />
            </div>

            <button id="agregarEmpleadoBtn" class="btn btn-primary">
              Agregar empleado
            </button>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th scope="col" class="text-light">ID</th>
                <th scope="col" class="text-light">Nombre</th>
                <th scope="col" class="text-light">Email</th>
                <th scope="col" class="text-light">Acciones</th>
              </tr>
            </thead>
            <tbody id="empleados"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para editar empleado -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Editar Empleado</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="editNombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="editNombre" placeholder="Nombre del empleado" />
          </div>
          <div class="mb-3">
            <label for="editEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="editEmail" placeholder="Email del empleado" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cerrar
          </button>
          <button type="button" class="btn btn-primary" id="guardarCambiosBtn">
            Guardar cambios
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const empleados = document.getElementById("empleados");
      let contadorID = 1;
      let empleadoActual = null; // Para almacenar el empleado que estamos editando

      // Función para agregar un empleado a la tabla
      function agregarEmpleado(nombre, email) {
        let nuevoEmpleado = `<tr data-id="${contadorID}">
              <td class = 'text-light'>${contadorID++}</td>
              <td class = 'text-light'>${nombre}</td>
              <td class = 'text-light'>${email}</td>
              <td>
                <button class='btn btn-warning btn-sm editarEmpleado'>Editar</button>
                <button class='btn btn-danger btn-sm eliminarEmpleado'>Eliminar</button>
              </td>
            </tr>`;
        empleados.innerHTML += nuevoEmpleado;
      }

      // Escuchar el evento del botón para agregar empleados o la tecla "Enter"
      const agregarEmpleadoBtn =
        document.getElementById("agregarEmpleadoBtn");
      const nombreInput = document.getElementById("nombre");
      const emailInput = document.getElementById("email");

      function procesarAgregarEmpleado() {
        const nombre = nombreInput.value;
        const email = emailInput.value;

        // Validar que los campos no estén vacíos
        if (nombre !== "" && email !== "") {
          agregarEmpleado(nombre, email);
          nombreInput.value = "";
          emailInput.value = "";
        } else {
          alert("Por favor, complete todos los campos.");
        }
      }

      // Agregar eventos keyup a los inputs
      nombreInput.addEventListener("keyup", function (e) {
        if (e.key === "Enter") {
          procesarAgregarEmpleado();
        }
      });

      emailInput.addEventListener("keyup", function (e) {
        if (e.key === "Enter") {
          procesarAgregarEmpleado();
        }
      });

      agregarEmpleadoBtn.addEventListener("click", procesarAgregarEmpleado);

      // Evento para abrir el modal de edición con los datos actuales del empleado
      document.addEventListener("click", function (e) {
        if (e.target.classList.contains("editarEmpleado")) {
          const fila = e.target.closest("tr");
          const nombre = fila.children[1].innerText;
          const email = fila.children[2].innerText;

          document.getElementById("editNombre").value = nombre;
          document.getElementById("editEmail").value = email;
          empleadoActual = fila; // Guardamos la fila actual para actualizarla

          // Abrir modal de edición
          const editModal = new bootstrap.Modal(
            document.getElementById("editModal")
          );
          editModal.show();
        }

        // Evento para eliminar el empleado
        if (e.target.classList.contains("eliminarEmpleado")) {
          if (
            confirm("¿Estás seguro de que deseas eliminar este empleado?")
          ) {
            e.target.closest("tr").remove(); // Eliminar la fila de la tabla
          }
        }
      });

      // Guardar los cambios realizados en el modal o al presionar "Enter"
      const guardarCambiosBtn = document.getElementById("guardarCambiosBtn");
      const editNombreInput = document.getElementById("editNombre");
      const editEmailInput = document.getElementById("editEmail");

      function procesarGuardarCambios() {
        const nuevoNombre = editNombreInput.value;
        const nuevoEmail = editEmailInput.value;

        if (nuevoNombre !== "" && nuevoEmail !== "") {
          empleadoActual.children[1].innerText = nuevoNombre;
          empleadoActual.children[2].innerText = nuevoEmail;

          // Cerrar el modal
          const editModal = bootstrap.Modal.getInstance(
            document.getElementById("editModal")
          );
          editModal.hide();
        } else {
          alert("Por favor, complete todos los campos.");
        }
      }

      // Agregar eventos keyup para guardar cambios en el modal
      editNombreInput.addEventListener("keyup", function (e) {
        if (e.key === "Enter") {
          procesarGuardarCambios();
        }
      });

      editEmailInput.addEventListener("keyup", function (e) {
        if (e.key === "Enter") {
          procesarGuardarCambios();
        }
      });

      guardarCambiosBtn.addEventListener("click", procesarGuardarCambios);
    });
  </script>
</body>

</html>
